name: CI

on:
  push:
    branches:
      - main
      - cleanup/**
      - feature/**
      - bugfix/**
  pull_request:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:            # инфраструктура для pytest
      redis:
        image: redis:7
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant
        ports: ['6333:6333']
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        ports: ['9000:9000']

    steps:
      - uses: actions/checkout@v3

      # ---------- Backend tests ----------
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y netcat-openbsd
          pip install -r backend/requirements.txt --quiet

      - name: Wait for services
        run: |
          echo "Waiting for Qdrant..."
          timeout 60s bash -c 'until curl -f http://localhost:6333/collections; do sleep 2; done'
          echo "Waiting for MinIO..."
          timeout 60s bash -c 'until curl -f http://localhost:9000/minio/health/ready; do sleep 2; done'
          echo "Waiting for Redis..."
          timeout 60s bash -c 'until nc -z localhost 6379; do sleep 2; done'
          echo "All services are ready!"

      - name: Run pytest (unit/integration only)
        env:
          CI_MODE: true  # Включаем CI режим для тестов
          OPENAI_API_KEY: stub
          PYTHONPATH: ${{ github.workspace }}
          REDIS_HOST: localhost
          QDRANT_HOST: localhost
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          DB_PATH: /tmp/test-chatlog.db
        run: pytest -q --tb=short -k "not e2e"        # исключаем e2e из этого job

      # ---------- Front build ----------
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }

      - name: Build UI
        run: |
          cd frontend
          npm ci
          npm run build

      # ---------- Docker build ----------
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ib-backend .

  archlint:
    name: Architecture Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: |
          pip install -r requirements-dev.txt
          python -c "import yaml; print('pyyaml ok')" || pip install pyyaml

      - name: Run archlint
        run: |
          make archlint

  e2e:
    name: E2E (fake-openai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Python 3.11 (for host-side pytest/ws_probe)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install minimal test deps on runner
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout websockets minio qdrant-client prometheus-client
      - name: Build images
        run: |
          docker compose --profile test build fake-openai backend
      - name: Run E2E
        env:
          OPENAI_BASE_URL: http://localhost:8081/v1
          OPENAI_API_KEY: test_key_ci
          DISABLE_WEB_SEARCH: '1'
          E2E_MODE: '1'
        run: |
          make test-e2e
