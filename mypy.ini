[mypy]
python_version = 3.11
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unused_configs = True
no_implicit_optional = True
strict_equality = True
explicit_package_bases = True

[mypy-backend.*]
ignore_missing_imports = True

# Ignore third-party libs without stubs
[mypy-google.*]
ignore_missing_imports = True

[mypy-autogen]
ignore_missing_imports = True

[mypy-autogen.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

# Generated/protobuf code and auto-generated files are excluded from strict typing
[mypy-backend.generated.*]
ignore_errors = True

[mypy-backend.chat_pb2]
ignore_errors = True

[mypy-backend.generated.chat_pb2]
ignore_errors = True

[mypy-backend.chat_grpc]
ignore_errors = True

[mypy-backend.agents.expert_gc]
ignore_errors = True

[mypy-backend.agents.planner]
ignore_errors = True
